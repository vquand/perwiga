[workspace]
members = [
    "crates/perwiga-core",
    "crates/perwiga-cli",
    "crates/perwiga-web",
    "games/generic",
    "games/arknights-endfield",
    "novels/generic",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
axum = "0.8.4"
chrono = { version = "0.4.41", features = ["clock", "serde"] }
clap = { version = "4.5.45", features = ["derive"] }
quick-xml = "0.37.5"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.2", features = ["util"] }
url = "2.5.4"
uuid = { version = "1.18.0", features = ["v4"] }
